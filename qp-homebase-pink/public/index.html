<!doctype html>
<html lang="en-GB" data-theme="pink-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="format-detection" content="telephone=no">
  <title>Qp Homebase Ruby Edition</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruby Homebase">
  <meta name="theme-color" content="#0b0709">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="brand/logo-full.png" as="image">
  <link rel="preload" href="fonts/great-vibes-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=1.2.0">
</head>
<body>
  <canvas id="liquid" aria-hidden="true" hidden></canvas>
  <div id="bgPoster" aria-hidden="true"></div>
  <video id="bgVideo" class="bg-video" muted loop playsinline webkit-playsinline autoplay preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
  <div id="veil" aria-hidden="true"></div>

  <!-- Welcome screen -->
  <section id="welcome" class="welcome" hidden>
    <div class="theme-dots" id="welcomeDots" aria-label="Theme"></div>
    <div class="welcome-mid">
      <div class="logo-halo"><div class="logo-full" role="img" aria-label="Ruby Homebase"></div></div>
      <div class="edition-badge">Qp Homebase · Ruby Edition</div>
      <h1 id="welcomeHello">Welcome RubyQp</h1>
      <p class="love-note">I love you my smudge <span class="heart" aria-hidden="true">♥</span></p>
      <p id="welcomeLine" class="muted"></p>
    </div>
    <button id="welcomeGo" class="btn primary wide">Continue</button>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden>‹</button>
      <div class="top-title">
        <div class="brand"><span class="logo-mono" aria-hidden="true"></span> <span id="viewTitle">Homebase</span><span class="edition">Ruby Edition</span></div>
        <div class="sub" id="viewSub"></div>
      </div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">⚙︎</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs" id="tabs">
      <button data-go="home"><i>⌂</i><span>Home</span></button>
      <button data-go="planner"><i>◷</i><span>Planner</span></button>
      <button data-go="meals"><i>❦</i><span>Meals</span></button>
      <button data-go="money"><i>£</i><span>Budget</span></button>
      <button data-go="more"><i>☰</i><span>More</span></button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
