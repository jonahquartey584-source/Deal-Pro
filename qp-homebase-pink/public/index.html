<!doctype html>
<html lang="en-GB" data-theme="pink-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="format-detection" content="telephone=no">
  <title>Qp Homebase Ruby Edition</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruby Homebase">
  <meta name="theme-color" content="#0b0709">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="ruby-icon-180.png">
  <link rel="preload" href="brand/logo-full.webp" as="image">
  <link rel="preload" href="fonts/great-vibes-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/liquid.js">
  <link rel="modulepreload" href="js/views/home.js">
  <link rel="modulepreload" href="js/views/shared.js">
  <link rel="preload" href="brand/logo-mono.webp" as="image">
</head>
<body>
  <canvas id="liquid" aria-hidden="true" hidden></canvas>
  <div id="bgPoster" aria-hidden="true"></div>
  <video id="bgVideo" class="bg-video" muted loop playsinline webkit-playsinline autoplay preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
  <div id="veil" aria-hidden="true"></div>

  <!-- Welcome screen -->
  <section id="welcome" class="welcome" hidden>
    <div class="theme-dots" id="welcomeDots" aria-label="Theme"></div>
    <div class="welcome-mid">
      <div class="logo-halo"><div class="logo-full" role="img" aria-label="Ruby Homebase"></div></div>
      <div class="edition-badge">Qp Homebase · Ruby Edition</div>
      <h1 id="welcomeHello">Welcome RubyQp</h1>
      <p class="love-note">I love you my smudge <span class="heart" aria-hidden="true">♥</span></p>
      <p id="welcomeLine" class="muted"></p>
    </div>
    <button id="welcomeGo" class="btn primary wide">Continue</button>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-row">
        <button class="icon-btn glass" id="backBtn" aria-label="Back" hidden></button>
        <span class="logo-mono" aria-hidden="true"></span><span class="edition">Ruby Edition</span>
        <span class="grow"></span>
        <button class="icon-btn glass" id="settingsBtn" data-go="settings" aria-label="Settings"></button>
      </div>
      <div class="sub" id="viewSub"></div>
      <h1 class="large-title" id="viewTitle">Homebase</h1>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs glass" id="tabs">
      <span class="tab-pill" aria-hidden="true"></span>
      <button data-go="home" data-icon="home"><span>Home</span></button>
      <button data-go="planner" data-icon="planner"><span>Planner</span></button>
      <button data-go="meals" data-icon="meals"><span>Meals</span></button>
      <button data-go="money" data-icon="money"><span>Budget</span></button>
      <button data-go="more" data-icon="more"><span>More</span></button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
