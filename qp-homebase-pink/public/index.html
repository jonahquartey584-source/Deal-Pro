<!doctype html>
<html lang="en-GB" data-theme="pink-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="format-detection" content="telephone=no">
  <title>Qp Homebase Ruby Edition</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruby Homebase">
  <meta name="theme-color" content="#0b0709">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=1.2.0">
</head>
<body>
  <canvas id="liquid" aria-hidden="true" hidden></canvas>
  <video id="bgVideo" class="bg-video" muted loop playsinline webkit-playsinline autoplay preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true" poster="media/pink-dark.jpg"></video>
  <div id="veil" aria-hidden="true"></div>

  <!-- Welcome screen -->
  <section id="welcome" class="welcome" hidden>
    <div class="theme-dots" id="welcomeDots" aria-label="Theme"></div>
    <div class="welcome-mid">
      <div class="logo-badge"><svg class="qp-badge" viewBox="0 0 100 100" role="img" aria-label="Ruby Homebase"><circle cx="50" cy="50" r="50" class="qp-disc"/><text x="50" y="44" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.6" class="qp-ink">Ruby</text><text x="50" y="71" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.3" class="qp-ink">HOMEBASE</text></svg></div>
      <div class="edition-badge">Qp Homebase · Ruby Edition</div>
      <h1 id="welcomeHello">Welcome RubyQp</h1>
      <p id="welcomeLine" class="muted"></p>
    </div>
    <button id="welcomeGo" class="btn primary wide">Continue</button>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden>‹</button>
      <div class="top-title">
        <div class="brand"><svg class="qp-mini" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" class="qp-disc"/><text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.8" class="qp-ink">Ruby</text></svg> <span id="viewTitle">Homebase</span><span class="edition">Ruby Edition</span></div>
        <div class="sub" id="viewSub"></div>
      </div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">⚙︎</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabs" id="tabs">
      <button data-go="home"><i>⌂</i><span>Home</span></button>
      <button data-go="planner"><i>◷</i><span>Planner</span></button>
      <button data-go="meals"><i>❦</i><span>Meals</span></button>
      <button data-go="money"><i>£</i><span>Budget</span></button>
      <button data-go="more"><i>☰</i><span>More</span></button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
