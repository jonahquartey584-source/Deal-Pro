<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property deals · Deal Pro</title>
<meta name="robots" content="noindex">
<meta name="description" content="Property deals shared with Deal Pro.">
<meta property="og:title" content="Property deals · Deal Pro">
<meta property="og:description" content="Deals found and scored with Deal Pro. Open the link to see each deal.">
<meta property="og:site_name" content="Deal Pro">
<meta property="og:type" content="website">
<meta property="og:image" content="https://usedealpro.com/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161A;--ink2:#3F444D;--muted:#6B707A;--line:#E3E5E9;--brand:#E0142B;--bg:#0B0B0D}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px 48px}
.wrap{max-width:820px;margin:0 auto}
.head h1{margin:6px 0 8px;font-size:24px;line-height:1.2;color:#fff;text-wrap:balance}
.head p{margin:0 0 12px;font-size:13.5px;color:rgba(255,255,255,.72)}
.card{background:#fff;border-radius:10px;margin:0 0 16px;padding:16px 18px 18px}
.card h2{margin:0 0 10px;font-size:17px;line-height:1.3}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:flex;gap:10px;margin:4px 0;font-size:14px;color:var(--ink2)}
.card li .e{width:22px;flex:none;text-align:center}.card li span:last-child{min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{display:inline-block;padding:10px 18px;border-radius:7px;background:var(--brand);color:#fff;font:600 14px Geist,system-ui,sans-serif;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:9px 16px}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foot{font-size:12px;margin:16px 0 0;color:rgba(255,255,255,.7)}.foot a{color:#fff}
.msg{color:#fff;text-align:center;padding:80px 16px}.msg p{color:rgba(255,255,255,.7)}.msg a{color:#fff}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="msg"><p>Loading the deals…</p></div></main>
<script>
(function(){
  var app=document.getElementById('app');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fail=function(t,d){app.innerHTML='<div class="msg"><h1>'+esc(t)+'</h1><p>'+esc(d)+'</p><p><a href="/">Deal Pro</a></p></div>'};
  var m=location.pathname.match(/\/deals\/([0-9a-f-]{36})/)||location.search.match(/[?&]id=([0-9a-f-]{36})/);
  if(!m){fail('Deals not found','Check the link you were sent.');return}
  fetch('/api/deal-lists?id='+m[1]).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(x){
    if(!x.ok||!x.j.list){fail('Deals not available',(x.j&&x.j.error)||'This link may have been removed.');return}
    var L=x.j.list,cards=L.cards||[];
    document.title=L.title+' · Deal Pro';
    app.innerHTML='<div class="head"><h1>'+esc(L.title)+'</h1>'+(L.intro?'<p>'+esc(L.intro)+'</p>':'')+'</div>'+
      cards.map(function(c){
        var lines=(c.lines||[]).filter(function(l){return l[0]!=='🔗'&&l[0]!=='📄'});
        var acts=(c.url&&!L.preNDA?'<a class="btn ghost" href="'+esc(c.url)+'" target="_blank" rel="noopener noreferrer">View listing ↗</a>':'')+
          (c.pack?'<a class="btn" href="/pack/'+esc(c.pack)+'" target="_blank" rel="noopener">View deal pack →</a>':'');
        return '<article class="card"><h2>'+esc(c.head)+'</h2><ul>'+lines.map(function(l){return '<li><span class="e">'+esc(l[0])+'</span><span>'+esc(l[1])+'</span></li>'}).join('')+'</ul>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</article>'}).join('')+
      (L.foot?'<p class="foot">'+esc(L.foot)+'</p>':'')+'<p class="foot">Found with <a href="/">Deal Pro</a> · usedealpro.com</p>';
  }).catch(function(){fail('Could not load the deals','Check your connection and try again.')});
})();
</script>
</body>
</html>
