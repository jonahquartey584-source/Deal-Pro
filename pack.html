<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal pack · Deal Pro</title>
<meta name="robots" content="noindex">
<meta name="description" content="A pre-NDA property deal summary made with Deal Pro.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161A;--ink2:#3F444D;--muted:#6B707A;--line:#E3E5E9;--soft:#F5F6F8;--brand:#E0142B;--good:#16794A;--bad:#B42318;--bg:#0B0B0D}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:24px 16px 40px}
.wrap{max-width:820px;margin:0 auto}
.paper{background:#fff;border-radius:6px;padding:32px 40px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--brand);font-size:12.5px;color:var(--muted)}
.top b{color:var(--brand);font-weight:600}
h1{margin:22px 0 2px;font-size:28px;line-height:1.15;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:13.5px}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:6px;margin:18px 0 4px}
.gal.one{grid-template-columns:1fr}
.gal img{display:block;width:100%;height:100%;object-fit:cover;border-radius:4px;background:var(--soft)}
.gal .main{aspect-ratio:3/2}
.thumbs{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px}
.thumbs button{padding:0;border:0;background:none;cursor:pointer;border-radius:4px;overflow:hidden}
.thumbs button:last-child:nth-child(odd){grid-column:span 2}
.verdict{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:22px 0 6px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.verdict h2{margin:0;font-size:17px;letter-spacing:-.01em}
.verdict p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.score{font:600 30px/1 "Geist Mono",ui-monospace,monospace;white-space:nowrap}
.score span{font-size:13px;color:var(--muted)}
h3{margin:26px 0 8px;font-size:14px;letter-spacing:-.005em;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.grid div{padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.grid span{display:block;font-size:12px;color:var(--muted)}
.grid b{font:600 15px/1.35 "Geist Mono",ui-monospace,monospace;overflow-wrap:anywhere}
ul{margin:0;padding-left:20px}li{margin:3px 0;color:var(--ink2)}
.cta{margin-top:26px;padding:18px;border-radius:8px;background:#14161A;color:#fff}
.cta h3{color:#fff;border-color:rgba(255,255,255,.15);margin-top:0}
.cta p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:14px}
.cta b{color:#fff}
.small{font-size:12px;color:var(--muted);margin-top:18px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.foot a{color:var(--muted)}
.msg{color:#fff;text-align:center;padding:80px 16px}
.msg h1{color:#fff;margin-bottom:8px}.msg p{color:rgba(255,255,255,.7)}.msg a{color:#fff}
@media (max-width:640px){.paper{padding:22px 18px 20px}h1{font-size:23px}.gal{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(3,1fr)}.thumbs button:last-child:nth-child(odd){grid-column:auto}.verdict{flex-direction:column}}
@media print{body{background:#fff;padding:0}.paper{box-shadow:none;padding:0}}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="msg"><p>Loading the deal pack…</p></div></main>
<script>
(function(){
  var app=document.getElementById('app');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fail=function(t,d){document.title='Deal pack · Deal Pro';app.innerHTML='<div class="msg"><h1>'+esc(t)+'</h1><p>'+esc(d)+'</p><p><a href="/">Deal Pro</a></p></div>'};
  var m=location.pathname.match(/\/pack\/([0-9a-f-]{36})/)||location.search.match(/[?&]id=([0-9a-f-]{36})/);
  if(!m){fail('Deal pack not found','Check the link you were sent.');return}
  fetch('/api/packs?id='+m[1]).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(x){
    if(!x.ok||!x.j.pack){fail('Deal pack not available',(x.j&&x.j.error)||'This deal pack may have been removed.');return}
    var p=x.j.pack,ph=p.photos||[],when=p.createdAt?new Date(p.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
    var grid=function(rows){return rows&&rows.length?'<div class="grid">'+rows.map(function(r){return '<div><span>'+esc(r.label)+'</span><b>'+esc(r.value)+'</b></div>'}).join('')+'</div>':''};
    var img=function(u,c){return '<img class="'+c+'" src="'+esc(u)+'" alt="" referrerpolicy="no-referrer" onerror="this.closest(\'button\')?this.closest(\'button\').remove():this.remove()">'};
    document.title=p.title+' · Deal pack';
    app.innerHTML='<article class="paper">'+
      '<div class="top"><b>Investment summary · Pre-NDA</b><span>'+esc(when)+'</span></div>'+
      '<h1>'+esc(p.title)+'</h1><div class="sub">'+[p.location,p.strategy?p.strategy+' opportunity':''].filter(Boolean).map(esc).join(' | ')+'</div>'+
      (ph.length?'<div class="gal'+(ph.length===1?' one':'')+'">'+img(ph[0],'main')+(ph.length>1?'<div class="thumbs">'+ph.slice(1,5).map(function(u){return '<button type="button" data-u="'+esc(u)+'" aria-label="Show this photo">'+img(u,'')+'</button>'}).join('')+'</div>':'')+'</div>':'')+
      (p.verdict||p.score!=null?'<div class="verdict"><div><h2>'+esc(p.verdict||'Analysed')+'</h2>'+(p.summary?'<p>'+esc(p.summary)+'</p>':'')+'</div>'+(p.score!=null?'<div class="score">'+esc(p.score)+'<span>/100</span></div>':'')+'</div>':'')+
      (p.facts&&p.facts.length?'<h3>The property</h3>'+grid(p.facts):'')+
      (p.metrics&&p.metrics.length?'<h3>Key figures</h3>'+grid(p.metrics):'')+
      (p.scenarios&&p.scenarios.length?'<h3>Monthly profit at different occupancy</h3>'+grid(p.scenarios):'')+
      (p.risks&&p.risks.length?'<h3>Things to check</h3><ul>'+p.risks.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul>':'')+
      '<div class="cta"><h3>Interested in this deal?</h3>'+
        '<p>Sourcing fee: <b>'+esc(p.fee||'on request')+'</b>. Reply to the person who sent you this link to reserve it. The full address and landlord details are shared once you have signed the terms of business.</p>'+
        (p.contact?'<p>Contact: <b>'+esc(p.contact)+'</b></p>':'')+
        (p.biz||p.redress?'<p>'+(p.biz?'Offered by <b>'+esc(p.biz)+'</b>':'')+(p.redress?(p.biz?' · ':'')+'Redress: '+esc(p.redress):'')+'</p>':'')+'</div>'+
      '<p class="small">Figures come from an analysis of the advert and local market data. They are estimates, not a forecast, and need checking before you commit. This summary is not financial, legal or investment advice.</p>'+
      '<div class="foot"><span>PRE-NDA DEAL PACK</span><span>Made with <a href="/">Deal Pro</a></span></div></article>';
    var main=app.querySelector('.gal .main');
    app.addEventListener('click',function(e){var b=e.target.closest('[data-u]');if(b&&main)main.src=b.getAttribute('data-u')});
  }).catch(function(){fail('Could not load the deal pack','Check your connection and try again.')});
})();
</script>
</body>
</html>
