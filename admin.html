<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal Pro Admin</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:dark;--bg:#0b0b0c;--panel:#151517;--line:#313137;--ink:#f5f5f5;--muted:#a3a3aa;--red:#e0142b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,12,.94);backdrop-filter:blur(10px)}.brand{font-weight:750}.top a{color:var(--ink);text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:42px 28px}.eyebrow{color:#ff6677;font-size:12px;text-transform:uppercase;letter-spacing:.14em}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:26px}.head h1{font-size:42px;margin:5px 0 0}.search{width:min(360px,100%);background:#101012;border:1px solid var(--line);border-radius:7px;padding:11px 13px;color:var(--ink)}.panel{border:1px solid var(--line);border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(220px,1.5fr) 150px 110px 120px auto;gap:12px;align-items:center;padding:16px 18px;background:var(--panel)}.row+.row{border-top:1px solid var(--line)}.email{font-weight:650}.sub{color:var(--muted);font-size:12px}.btn,select{border:1px solid var(--line);background:#202024;color:var(--ink);border-radius:6px;padding:8px 10px}.btn{cursor:pointer}.btn:hover{border-color:#777}.danger{color:#ff8d99}.status{font-size:12px;color:var(--muted)}.empty{padding:38px;text-align:center;color:var(--muted)}@media(max-width:760px){.head{display:grid}.row{grid-template-columns:1fr 1fr}.row>div:first-child{grid-column:1/-1}.actions{grid-column:1/-1}.top{padding:15px 16px}.wrap{padding:28px 16px}}</style></head>
<body><header class="top"><a class="brand" href="/">Deal Pro</a><div><a href="/">Back to site</a></div></header><main class="wrap"><div class="head"><div><div class="eyebrow">Administrator</div><h1>Customer accounts</h1><p class="status" id="status">Checking administrator access…</p></div><input class="search" id="search" type="search" placeholder="Search by customer email"></div><section class="panel" id="accounts"><div class="empty">Loading accounts…</div></section></main><script type="module" src="/assets/admin.js"></script></body></html>
