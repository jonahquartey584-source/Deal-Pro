[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The site is published from the repo root; keep source and config files private.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/src/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
